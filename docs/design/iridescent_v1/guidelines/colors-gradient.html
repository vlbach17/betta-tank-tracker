<!-- @dsCard group="Colors" viewport="700x150" subtitle="One per screen: CTA, avatar ring, or chart line" name="Signature gradient" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);font-family:var(--font-sans);color:var(--text-primary)}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw div{height:52px;border-radius:12px}.sw span{font:var(--text-meta);color:var(--text-secondary);line-height:1.4}</style></head><body><div style="display:flex;flex-direction:column;gap:10px"><div style="height:44px;border-radius:12px;background:var(--gradient-spunk)"></div><div class="row"><div class="sw"><div style="height:32px;background-image:var(--gradient-cta-track);background-size:200% 100%;background-position:0 0"></div><span>CTA rest — teal → royal</span></div><div class="sw"><div style="height:32px;background-image:var(--gradient-cta-track);background-size:200% 100%;background-position:100% 0"></div><span>CTA hover — violet → magenta</span></div></div><div class="row"><div class="sw"><div style="height:36px;background:var(--gradient-spunk-diag)"></div><span>--gradient-spunk-diag (avatar ring)</span></div><div class="sw"><div style="height:36px;background:var(--gradient-spunk-wash);border:1px solid var(--line)"></div><span>--gradient-spunk-wash (hero card)</span></div></div></div></body></html>
