<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);font-family:var(--font-sans);color:var(--text-primary)}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw div{height:52px;border-radius:12px}.sw span{font:var(--text-meta);color:var(--text-secondary);line-height:1.4}</style></head><body><div class="row" style="align-items:flex-end"><div class="sw"><div style="background:var(--white);border:1px solid var(--line);border-radius:var(--radius-tile);height:64px"></div><span>Tile 20<br>--radius-tile</span></div><div class="sw"><div style="background:var(--white);border:1px solid var(--line);border-radius:var(--radius-card);height:64px"></div><span>Card 24<br>--radius-card</span></div><div class="sw"><div style="background:var(--white);border:1px solid var(--line);border-radius:var(--radius-row);height:64px"></div><span>Row 16<br>--radius-row</span></div><div class="sw"><div style="background:var(--white);border:1px solid var(--line);border-radius:var(--radius-input);height:64px"></div><span>Input 14<br>--radius-input</span></div><div class="sw"><div style="background:var(--white);border:1px solid var(--line);border-radius:var(--radius-pill);height:64px"></div><span>Pill<br>--radius-pill</span></div></div></body></html>
