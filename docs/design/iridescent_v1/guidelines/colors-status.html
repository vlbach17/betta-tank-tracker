<!-- @dsCard group="Colors" viewport="700x150" subtitle="Solid fills; lime takes ink text, deep magenta takes white" name="Status" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);font-family:var(--font-sans);color:var(--text-primary)}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw div{height:52px;border-radius:12px}.sw span{font:var(--text-meta);color:var(--text-secondary);line-height:1.4}</style></head><body><div class="row"><div class="sw"><div style="background:var(--good-deep);display:flex;align-items:center;justify-content:center;color:var(--status-good-fg);font:var(--text-label-sm)">In range</div><span>Pill fill<br>--status-good-fill</span></div><div class="sw"><div style="background:var(--good);"></div><span>Dots &amp; charts<br>--good #6DA82E</span></div><div class="sw"><div style="background:var(--watch);display:flex;align-items:center;justify-content:center;color:var(--status-watch-fg);font:var(--text-label-sm)">Watch</div><span>Ink text<br>--watch</span></div><div class="sw"><div style="background:var(--bad-deep);display:flex;align-items:center;justify-content:center;color:#fff;font:var(--text-label-sm)">Out of range</div><span>Pill fill<br>--status-bad-fill</span></div><div class="sw"><div style="background:var(--bad);"></div><span>Dots &amp; charts<br>--bad</span></div><div class="sw"><div style="background:var(--overdue);"></div><span>Overdue (grey text)<br>--overdue</span></div></div></body></html>
