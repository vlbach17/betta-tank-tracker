<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);font-family:var(--font-sans);color:var(--text-primary)}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw div{height:52px;border-radius:12px}.sw span{font:var(--text-meta);color:var(--text-secondary);line-height:1.4}</style></head><body><div class="row" style="padding:8px 4px"><div class="sw"><div style="background:var(--white);border:1px solid var(--line);border-radius:var(--radius-tile);box-shadow:var(--shadow-tile);height:64px"></div><span>--shadow-tile</span></div><div class="sw"><div style="background:var(--white);border-radius:var(--radius-pill);box-shadow:var(--shadow-segment);height:40px;margin-top:12px"></div><span>--shadow-segment</span></div><div class="sw"><div style="background:var(--gradient-spunk);border-radius:var(--radius-pill);box-shadow:var(--shadow-cta);height:56px;margin-top:4px"></div><span>--shadow-cta</span></div></div></body></html>
