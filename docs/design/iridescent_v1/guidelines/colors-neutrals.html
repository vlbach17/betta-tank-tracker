<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);font-family:var(--font-sans);color:var(--text-primary)}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw div{height:52px;border-radius:12px}.sw span{font:var(--text-meta);color:var(--text-secondary);line-height:1.4}</style></head><body><div class="row"><div class="sw"><div style="background:var(--pearl);border:1px solid var(--line)"></div><span>App bg<br>--pearl</span></div><div class="sw"><div style="background:var(--white);border:1px solid var(--line)"></div><span>Surface<br>--white</span></div><div class="sw"><div style="background:var(--mist);"></div><span>Controls<br>--mist</span></div><div class="sw"><div style="background:var(--line);"></div><span>Border<br>--line</span></div><div class="sw"><div style="background:var(--ink-3);"></div><span>Tertiary text<br>--ink-3 #66697F</span></div><div class="sw"><div style="background:var(--ink-2);"></div><span>Secondary text<br>--ink-2</span></div><div class="sw"><div style="background:var(--ink);"></div><span>Ink<br>--ink #293132</span></div></div></body></html>
