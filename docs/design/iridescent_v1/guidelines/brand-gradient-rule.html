<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);font-family:var(--font-sans);color:var(--text-primary)}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw div{height:52px;border-radius:12px}.sw span{font:var(--text-meta);color:var(--text-secondary);line-height:1.4}</style></head><body><div class="row" style="align-items:center"><div class="sw"><div style="height:48px;border-radius:var(--radius-pill);background:var(--gradient-spunk);box-shadow:var(--shadow-cta);display:flex;align-items:center;justify-content:center;color:#fff;font:var(--text-label)">Log a test</div><span>Primary CTA</span></div><div class="sw" style="align-items:center"><div style="width:48px;height:48px;border-radius:50%;background:var(--gradient-spunk-diag);padding:2.5px"><div style="width:100%;height:100%;border-radius:50%;background:var(--mist);border:2px solid var(--pearl)"></div></div><span>Avatar ring</span></div><div class="sw"><svg viewBox="0 0 160 48" height="48" style="width:100%"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#14b8c4"/><stop offset=".5" stop-color="#3b5bdb"/><stop offset="1" stop-color="#d63a8f"/></linearGradient></defs><polyline points="4,40 40,30 80,34 120,14 156,8" fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round"/></svg><span>Chart line</span></div><div class="sw"><div style="height:48px;border-radius:12px;background:var(--gradient-spunk);opacity:.35;position:relative"><span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#171a33;font:var(--text-label)">Never on text</span></div><span>✕ Not allowed</span></div></div></body></html>
